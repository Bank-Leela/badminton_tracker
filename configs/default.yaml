# Default configuration. Every path is resolved relative to the repo root
# unless it is already absolute.

paths:
  data_dir: data
  raw_dir: data/raw
  cache_dir: data/cache
  labels_dir: data/labels
  tracknet_repo: external/TrackNetV3
  tracknet_ckpt: external/TrackNetV3/ckpts/TrackNet_best.pt
  inpaintnet_ckpt: external/TrackNetV3/ckpts/InpaintNet_best.pt
  # YOLO26x-pose, ultralytics/assets release v8.4.0 (126 MB).
  pose_model: external/models/yolo26x-pose.pt

# cuda | mps | cpu | auto
# auto picks cuda, then mps, then cpu. Development is on macOS (mps/cpu);
# production runs on an RTX 5070 (cuda). Nothing may hardcode a device.
device: auto

shuttle:
  # 8 peaks at ~3.8 GB on the GPU; 16 gives no speedup; 32 overflows a 12 GB
  # card and crawls.
  batch_size: 8
  # fp32: exact. fp16: autocast on CUDA, ~1.6x faster, heatmaps differ by
  # <1e-3 — enough to flip an occasional borderline pixel across
  # heatmap_threshold. Ignored on CPU/MPS.
  precision: fp32
  # nonoverlap: one pass, fast, lower accuracy.
  # weight:     sliding window + weighted temporal ensemble (TrackNetV3 default).
  eval_mode: weight
  # Heatmap probability threshold used to binarise before blob localisation.
  # This is TrackNetV3's own hardcoded 0.5; exposed here so it can be tuned.
  heatmap_threshold: 0.5

overlay:
  # Number of past contacts of the trajectory to trail behind the current frame.
  traj_len: 8
  radius: 3
  color: [0, 0, 255]   # BGR — red

segment:
  # Play view = the static main camera, found by matching each frame's white
  # pixels to the court-line layout most common in the range. Changing any
  # mask_* / white_* key needs `--force` (the masks are cached); the rest
  # rerun in seconds.
  mask_width: 320             # lines are 1-2 px here; 160 loses the far ones
  white_max_sat: 60           # HSV saturation (0-255): lines are unsaturated...
  white_min_val: 170          # ...and bright
  # Pass 1 frames scoring at least this against the dominant shared layout
  # seed pass 2. Pass 1 scores are inflated by the score graphic, so this
  # sits above play_score.
  seed_score: 0.75
  # Play view when the final score (0..1) is at least this. `auto`: the
  # valley between the two score modes, per match — the gap moves by
  # broadcast (0.40-0.65 in 2018-19, 0.55-0.75 at All England 2026), so no
  # fixed value sits mid-gap everywhere. A number overrides it.
  play_score: auto
  # Majority vote over this window absorbs flashes and wipe frames.
  play_smooth_s: 0.5
  # Play spans shorter than this are dropped: glimpses of close-ups scoring
  # just over the line; no rally fits in one.
  play_min_s: 2.0
  # Play separated from the rest by a longer gap than this is another match
  # in the stream (India Open 2023 opens on the doubles final); only the
  # cluster with the most play is kept. Within a match the longest gap seen
  # across 32 matches is 4.7 min.
  match_gap_min: 6.0
  # Rally boundaries from shuttle visibility inside play segments.
  rally_smooth_s: 1.0         # box filter on the visible flag
  rally_min_s: 1.5            # drop shorter runs (a toss, a false detection)
  # Bridge shorter gaps (shuttle lost at a clear's apex or out of frame).
  # 4 s: within play spans, gaps of 2.0-3.2 s were lost shuttles splitting one
  # rally (Arctic Open 2025: 127 rallies for 106 points at 2 s, ~109 at 4 s);
  # a real between-point pause is longer.
  rally_max_gap_s: 4.0

court:
  # Pixel sizes are at 1080p and scale with the source height.
  # Empty-court background: median of this many play-view frames.
  background_frames: 61
  # Line pixels: luma above the local background (white top-hat) by this
  # much, with a structuring element wider than any court line.
  tophat_px: 15
  tophat_min: 30
  # Hough: shortest segment kept; segments this close (px, same angle
  # within 1 degree) are one line; best-supported lines kept per direction.
  hough_min_len_px: 80
  merge_px: 5
  max_candidates: 10
  # The plan's invariant: measured court length 13.40 m (and width 6.10 m)
  # within this.
  length_tolerance_m: 0.2
  # Mean distance (px) from the projected court lines to line pixels. Above
  # this a play span is refitted on its own frames, then left for manual.
  max_cost_px: 2.0
  # Frames per play span for that check.
  span_frames: 7

players:
  detect:
    # Changing any of these needs `--force` (~20 min of GPU a match).
    # Pixels on the long side. 640 loses the far player in some frames;
    # 1920 adds nothing over 1280.
    imgsz: 1280
    precision: fp16           # CUDA only; fp32 elsewhere
    batch_size: 8             # batching barely helps: the GPU is the limit
    conf: 0.1                 # ByteTrack wants the low-confidence boxes too
    # Tracked: people whose feet land within |x|, |y| metres of the court
    # centre (the doubles court is ±3.05 x ±6.70). Wide enough for line
    # judges and the umpire, so `select` can be checked against them.
    region_m: [7.0, 11.0]
    # Keypoint confidence for the feet used in that test (both ankles, else
    # the box bottom) and for the shirt/shorts colours.
    kpt_conf: 0.5
    tracker:                  # ultralytics' bytetrack.yaml defaults
      track_high_thresh: 0.25
      track_low_thresh: 0.1
      new_track_thresh: 0.25
      track_buffer: 30
      match_thresh: 0.8
      fuse_score: true
  # Everything below reruns in seconds (`players.parquet`).
  # Both ankles at least this confident: feet = ankle midpoint; else the
  # bottom centre of the box.
  ankle_conf: 0.5
  # Who counts as a player: feet within the doubles court plus these margins
  # (line judges and the umpire sit further out).
  side_margin_m: 1.0
  back_margin_m: 2.0
  # Within this of the net a person's half is their track's usual half, not
  # the sign of y (feet by the post read a few cm over the line).
  net_band_m: 1.0
  # Far player's feet behind the near player: kept only if both ankles are
  # at least this sure (at 0.9+ they were as accurate as feet in the open;
  # below, off by 0.3-1 m at the median). Otherwise court_x/y is NaN.
  hidden_ankle_conf: 0.9
  # Identity across ends. Ends change only in a break: a gap between play
  # spans at least this long (game breaks are 2 min, the 11-point interval
  # 1 min; between points is under 30 s).
  min_break_s: 40.0
  max_end_changes: 3          # after games 1 and 2, and at 11 in the third
  # Colour misfit (Lab units, summed over blocks of play) charged per change
  # of ends, so weak evidence keeps the players where they were.
  switch_cost: 10.0
  # A chosen track whose median clothes colour is further than this (Lab)
  # from the player expected there is someone else — a court cleaner while
  # the player is at their bag — and is dropped. Real player tracks: up to
  # ~90 on the first four matches; cleaners and officials: 105-195.
  max_track_colour: 100.0
  # Speed (the `speed` column): positions median-filtered over this many
  # frames, then a centred difference over this window. Short on purpose
  # (plan: a long smoothing window caused a measurement bug before).
  smooth_frames: 5
  speed_window_s: 0.2
  # The plan's 4 m/s: reported (share of rally frames above it), not
  # asserted — elite players run back to front at ~5 m/s, and a far-end
  # jump reads 10-15 m/s for 0.2 s (ankles off the floor read as distance).
  report_speed_mps: 4.0
  # Asserted inside rallies instead (decided 2026-10-04): what one person
  # moving cannot do. Real play on the first match peaked at 1.2 m a frame
  # and 5.5 m/s over 1 s; swaps and hidden feet jump 2-3 m in one frame.
  max_step_m: 1.5
  max_sustained_mps: 6.0
  sustained_window_s: 1.0
